<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LinkedIn Posting Agent</title>
  <!-- Bootstrap 5 CSS -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
  <!-- Animate.css for animations -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
  <!-- Custom CSS -->
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-md-8">
        <!-- Hero Section -->
        <div class="text-center mb-4">
          <h1 class="display-4 animate__animated animate__fadeInDown">LinkedIn Posting Agent</h1>
          <p class="lead animate__animated animate__fadeInUp">Generate and post beautiful LinkedIn content in seconds!</p>
        </div>
        <!-- Flash messages -->
        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            {% for category, message in messages %}
              <div class="alert alert-{{ category }} animate__animated animate__fadeIn" role="alert">
                {{ message }}
              </div>
            {% endfor %}
          {% endif %}
        {% endwith %}
        <!-- Form Section -->
        <form method="POST" class="card p-4 shadow animate__animated animate__fadeInUp">
          <div class="mb-3">
            <label for="topic" class="form-label">Topic</label>
            <input type="text" class="form-control" id="topic" name="topic" placeholder="Enter the post topic" required>
          </div>
          <div class="mb-3">
            <label for="tone" class="form-label">Tone</label>
            <input type="text" class="form-control" id="tone" name="tone" placeholder="Friendly, professional, etc." required>
          </div>
          <div class="mb-3">
            <label for="audience" class="form-label">Audience</label>
            <input type="text" class="form-control" id="audience" name="audience" placeholder="E.g., professionals, tech enthusiasts" required>
          </div>
          <div class="mb-3">
            <label for="details" class="form-label">Details</label>
            <textarea class="form-control" id="details" name="details" rows="3" placeholder="Additional details or context" required></textarea>
          </div>
          <div class="mb-3">
            <label for="hashtags" class="form-label">Hashtags</label>
            <input type="text" class="form-control" id="hashtags" name="hashtags" placeholder="E.g., #AI, #LinkedIn" required>
          </div>
          <button type="submit" class="btn btn-primary w-100 animate__animated animate__pulse animate__infinite">Generate & Post</button>
        </form>
      </div>
    </div>
  </div>

  <!-- Bootstrap Bundle with Popper -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Custom JS -->
  <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
